name: openquyhoach

services:
  db:
    build:
      context: .
      dockerfile: infra/docker/postgis.Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oqh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oqh}
      POSTGRES_DB: ${POSTGRES_DB:-openquyhoach}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oqh -d openquyhoach"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/oqh-artifacts local/oqh-published || true;
      mc anonymous set none local/oqh-artifacts || true;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  # Valkey is a drop-in Redis-protocol replacement — used because it is the
  # locally available image; any Redis-compatible server works.
  redis:
    image: valkey/valkey:9.1.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      OQH_DATABASE_URL: postgresql+psycopg://oqh:oqh@db:5432/openquyhoach
      OQH_S3_ENDPOINT: http://minio:9000
      OQH_REDIS_URL: redis://redis:6379/0
      OQH_QUEUE_BACKEND: ${OQH_QUEUE_BACKEND:-inline}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: .env
    environment:
      OQH_DATABASE_URL: postgresql+psycopg://oqh:oqh@db:5432/openquyhoach
      OQH_S3_ENDPOINT: http://minio:9000
      OQH_REDIS_URL: redis://redis:6379/0
      OQH_QUEUE_BACKEND: redis
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles: ["worker"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      NEXT_PUBLIC_BASEMAP_STYLE: ${NEXT_PUBLIC_BASEMAP_STYLE:-https://demotiles.maplibre.org/style.json}
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles: ["web"]

volumes:
  db-data:
  minio-data:
