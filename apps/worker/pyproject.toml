[project]
name = "openquyhoach-worker"
version = "0.1.0"
description = "Queue worker — runs ingestion, publication and maintenance jobs."
requires-python = ">=3.12"
dependencies = [
  "openquyhoach-core",
  "openquyhoach-geo",
  "openquyhoach-ingest",
  "openquyhoach-quality",
  "openquyhoach-services",
  "redis>=5.2",
]

[project.scripts]
openquyhoach-worker = "openquyhoach_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openquyhoach_worker"]
