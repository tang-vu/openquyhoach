[project]
name = "openquyhoach-api"
version = "0.1.0"
description = "FastAPI application exposing the OpenQuyHoach data plane."
requires-python = ">=3.12"
dependencies = [
  "openquyhoach-core",
  "openquyhoach-geo",
  "openquyhoach-ingest",
  "openquyhoach-quality",
  "openquyhoach-services",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "redis>=5.2",
]

[project.scripts]
openquyhoach-api = "openquyhoach_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openquyhoach_api"]
