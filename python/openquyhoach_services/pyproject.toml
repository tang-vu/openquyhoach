[project]
name = "openquyhoach-services"
version = "0.1.0"
description = "Domain services shared by API, CLI, worker and MCP: publish, compare, search, georef, provenance."
requires-python = ">=3.12"
dependencies = [
  "openquyhoach-core",
  "openquyhoach-geo",
  "openquyhoach-quality",
  "openquyhoach-ingest",
  "mercantile>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openquyhoach_services"]
