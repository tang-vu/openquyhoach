[project]
name = "openquyhoach-core"
version = "0.1.0"
description = "Core domain model, settings, storage and queue abstractions for OpenQuyHoach."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0.36",
  "geoalchemy2>=0.16",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "structlog>=24.4",
  "tenacity>=9.0",
  "boto3>=1.35",
  "redis>=5.2",
  "shapely>=2.0",
  "pyproj>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openquyhoach_core"]
