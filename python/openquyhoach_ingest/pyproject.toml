[project]
name = "openquyhoach-ingest"
version = "0.1.0"
description = "Source registry, connectors and the staged ingestion pipeline."
requires-python = ">=3.12"
dependencies = [
  "openquyhoach-core",
  "openquyhoach-geo",
  "openquyhoach-quality",
  "httpx>=0.28",
  "pypdf>=5.0",
  "pillow>=10.0",
  "lxml>=5.3",
  "beautifulsoup4>=4.12",
  "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openquyhoach_ingest"]
