[project]
name = "openquyhoach-mcp"
version = "0.1.0"
description = "EXPERIMENTAL MCP server exposing read-only OpenQuyHoach tools to agents."
requires-python = ">=3.12"
dependencies = [
  "openquyhoach-core",
  "openquyhoach-services",
  "mcp>=1.8",
]

[project.scripts]
openquyhoach-mcp = "openquyhoach_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openquyhoach_mcp"]
